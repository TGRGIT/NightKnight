name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # The iOS app links a CHECKED-IN xcframework built from nightknight-ffi/-core
  # (ios/scripts/build-rust-ffi.sh). This job recomputes the source hash and fails
  # when those sources changed without a rebuilt + recommitted artifact — a stale
  # xcframework would silently serve outdated analytics on-device. Pure hashing,
  # no Apple toolchain needed.
  ffi-staleness:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check committed xcframework matches FFI sources
      run: bash ios/scripts/build-rust-ffi.sh --check
